openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Twiga Travels & Tours API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tours
    description: Tour packages
  - name: bookings
    description: Booking inquiries
  - name: inquiries
    description: General inquiries
  - name: destinations
    description: Destination discovery
  - name: admin-auth
    description: Admin authentication
  - name: admin-dashboard
    description: Admin dashboard
  - name: admin-tours
    description: Admin tour management
  - name: admin-destinations
    description: Admin destination management
  - name: admin-bookings
    description: Admin booking management
  - name: admin-inquiries
    description: Admin inquiry management
  - name: admin-gallery
    description: Admin gallery management
  - name: admin-testimonials
    description: Admin testimonial management
  - name: admin-blog
    description: Admin blog management
  - name: admin-faqs
    description: Admin FAQ management
  - name: admin-team
    description: Admin team management
  - name: admin-settings
    description: Admin settings management
  - name: admin-users
    description: Admin user management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tours:
    get:
      operationId: listTours
      tags: [tours]
      summary: List tour packages
      parameters:
        - name: destination
          in: query
          schema: { type: string }
        - name: min_duration
          in: query
          schema: { type: integer }
        - name: max_duration
          in: query
          schema: { type: integer }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
        - name: activity_type
          in: query
          schema: { type: string }
        - name: is_featured
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/featured:
    get:
      operationId: getFeaturedTours
      tags: [tours]
      summary: Get featured tours
      responses:
        "200":
          description: Featured tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/stats:
    get:
      operationId: getTourStats
      tags: [tours]
      summary: Get aggregate stats about the tour catalog
      responses:
        "200":
          description: Tour statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourStats"

  /tours/{slug}:
    get:
      operationId: getTourBySlug
      tags: [tours]
      summary: Get a single tour by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List all available destinations
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Submit a booking inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a general inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin Auth ────────────────────────────────────────────────────────────

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/auth/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      summary: Get current admin user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/auth/change-password:
    post:
      operationId: adminChangePassword
      tags: [admin-auth]
      summary: Change admin password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordChange"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin Dashboard ───────────────────────────────────────────────────────

  /admin/dashboard/stats:
    get:
      operationId: adminGetDashboardStats
      tags: [admin-dashboard]
      summary: Get dashboard stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardStats"

  # ── Admin Tours ───────────────────────────────────────────────────────────

  /admin/tours:
    get:
      operationId: adminListTours
      tags: [admin-tours]
      summary: List all tours (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tours list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
    post:
      operationId: adminCreateTour
      tags: [admin-tours]
      summary: Create a tour
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTourInput"
      responses:
        "201":
          description: Tour created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/tours/{id}:
    get:
      operationId: adminGetTour
      tags: [admin-tours]
      summary: Get a tour by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminUpdateTour
      tags: [admin-tours]
      summary: Update a tour
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTourUpdate"
      responses:
        "200":
          description: Tour updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteTour
      tags: [admin-tours]
      summary: Delete a tour
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

