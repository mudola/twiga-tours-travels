      operationId: adminUpdateSettings
      tags: [admin-settings]
      summary: Update site settings (bulk upsert)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
