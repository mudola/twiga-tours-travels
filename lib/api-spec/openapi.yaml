components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Tour:
      type: object
      required: [id, title, slug, destination, duration_days, price_from, summary, is_featured, activity_type, gallery_urls, itinerary, inclusions, exclusions, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        destination: { type: string }
        duration_days: { type: integer }
        price_from: { type: number }
        summary: { type: string }
        activity_type: { type: string }
        gallery_urls:
          type: array
          items: { type: string }
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
        inclusions:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        is_featured: { type: boolean }
        max_group_size: { type: ["integer", "null"] }
        created_at: { type: string }

    ItineraryDay:
      type: object
      required: [day, title, description]
      properties:
        day: { type: integer }
        title: { type: string }
        description: { type: string }
        accommodation: { type: ["string", "null"] }
        meals: { type: ["string", "null"] }

    Destination:
      type: object
      required: [name, tour_count, image_url]
      properties:
        name: { type: string }
        tour_count: { type: integer }
        image_url: { type: ["string", "null"] }
        description: { type: ["string", "null"] }

    TourStats:
      type: object
      required: [total_tours, destinations_count, min_price, max_price, activity_types]
      properties:
        total_tours: { type: integer }
        destinations_count: { type: integer }
        min_price: { type: number }
        max_price: { type: number }
        activity_types:
          type: array
          items: { type: string }

    BookingInput:
      type: object
      required: [full_name, email, phone, travel_start_date, num_travelers]
      properties:
        tour_id: { type: ["string", "null"] }
        tour_title: { type: ["string", "null"] }
        full_name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        travel_start_date: { type: string }
        travel_end_date: { type: ["string", "null"] }
        num_travelers: { type: integer, minimum: 1 }
        accommodation_level: { type: ["string", "null"] }
        special_requests: { type: ["string", "null"] }
        add_ons:
          type: array
          items: { type: string }

    Booking:
      type: object
      required: [id, full_name, email, phone, travel_start_date, num_travelers, status, created_at]
      properties:
        id: { type: string }
        tour_id: { type: ["string", "null"] }
        tour_title: { type: ["string", "null"] }
        full_name: { type: string }
        email: { type: string }
        phone: { type: string }
        travel_start_date: { type: string }
        travel_end_date: { type: ["string", "null"] }
        num_travelers: { type: integer }
        accommodation_level: { type: ["string", "null"] }
        special_requests: { type: ["string", "null"] }
        add_ons:
          type: array
          items: { type: string }
        status: { type: string }
        created_at: { type: string }

    InquiryInput:
      type: object
      required: [full_name, email, message]
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        message: { type: string, minLength: 1 }

    Inquiry:
      type: object
      required: [id, full_name, email, message, created_at]
      properties:
        id: { type: string }
        full_name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        message: { type: string }
        created_at: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ── Admin Auth Schemas ────────────────────────────────────────────────────

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AdminAuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AdminUserProfile"

    AdminUserProfile:
      type: object
      required: [id, name, email, role, is_active, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        is_active: { type: boolean }
        created_at: { type: string }

    AdminPasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    # ── Admin Dashboard Schemas ───────────────────────────────────────────────

    AdminDashboardStats:
      type: object
      required: [total_bookings, total_tours, total_inquiries, new_bookings, pending_bookings, total_destinations, total_blog_posts, total_testimonials]
      properties:
        total_bookings: { type: integer }
        total_tours: { type: integer }
        total_inquiries: { type: integer }
        new_bookings: { type: integer }
        pending_bookings: { type: integer }
        total_destinations: { type: integer }
        total_blog_posts: { type: integer }
        total_testimonials: { type: integer }

    # ── Admin Tour Schemas ────────────────────────────────────────────────────

    AdminTourInput:
      type: object
      required: [title, slug, destination, duration_days, price_from, summary, activity_type]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        destination: { type: string, minLength: 1 }
        duration_days: { type: integer, minimum: 1 }
        price_from: { type: number, minimum: 0 }
        summary: { type: string, minLength: 1 }
        activity_type: { type: string }
        gallery_urls:
          type: array
          items: { type: string }
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
        inclusions:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        is_featured: { type: boolean }
        max_group_size: { type: ["integer", "null"] }

    AdminTourUpdate:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        destination: { type: string }
        duration_days: { type: integer }
        price_from: { type: number }
        summary: { type: string }
        activity_type: { type: string }
        gallery_urls:
          type: array
          items: { type: string }
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
        inclusions:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        is_featured: { type: boolean }
        max_group_size: { type: ["integer", "null"] }

    # ── Admin Destination Schemas ─────────────────────────────────────────────

    AdminDestination:
      type: object
      required: [id, name, slug, country, is_featured, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }
        country: { type: string }
        region: { type: ["string", "null"] }
        is_featured: { type: boolean }
        created_at: { type: string }

    AdminDestinationInput:
      type: object
      required: [name, slug, country]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: string }
        image_url: { type: string }
        country: { type: string }
        region: { type: string }
        is_featured: { type: boolean }

    AdminDestinationUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string }
        country: { type: string }
        region: { type: string }
        is_featured: { type: boolean }

    # ── Admin Booking Schemas ─────────────────────────────────────────────────

    AdminBookingStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── Admin Gallery Schemas ─────────────────────────────────────────────────

    AdminGalleryImage:
      type: object
      required: [id, url, category, sort_order, created_at]
      properties:
        id: { type: string }
        url: { type: string }
        caption: { type: ["string", "null"] }
        category: { type: string }
        sort_order: { type: integer }
        created_at: { type: string }

    AdminGalleryImageInput:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }
        caption: { type: string }
        category: { type: string }
        sort_order: { type: integer }

    # ── Admin Testimonial Schemas ─────────────────────────────────────────────

    AdminTestimonial:
      type: object
      required: [id, author_name, content, rating, is_approved, created_at]
      properties:
        id: { type: string }
        author_name: { type: string }
        author_title: { type: ["string", "null"] }
        avatar_url: { type: ["string", "null"] }
        content: { type: string }
        rating: { type: integer }
        is_approved: { type: boolean }
        created_at: { type: string }

    AdminTestimonialInput:
      type: object
      required: [author_name, content, rating]
      properties:
        author_name: { type: string, minLength: 1 }
        author_title: { type: string }
        avatar_url: { type: string }
        content: { type: string, minLength: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        is_approved: { type: boolean }

    AdminTestimonialUpdate:
      type: object
      properties:
        author_name: { type: string }
        author_title: { type: string }
        avatar_url: { type: string }
        content: { type: string }
        rating: { type: integer }
        is_approved: { type: boolean }

    # ── Admin Blog Schemas ────────────────────────────────────────────────────

    AdminBlogPost:
      type: object
      required: [id, title, slug, content, status, tags, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        excerpt: { type: ["string", "null"] }
        featured_image: { type: ["string", "null"] }
        status: { type: string }
        category: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        author_id: { type: ["string", "null"] }
        created_at: { type: string }
        updated_at: { type: string }

    AdminBlogPostInput:
      type: object
      required: [title, slug, content]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        content: { type: string }
        excerpt: { type: string }
        featured_image: { type: string }
        status: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }

    AdminBlogPostUpdate:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        excerpt: { type: string }
        featured_image: { type: string }
        status: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }

    # ── Admin FAQ Schemas ─────────────────────────────────────────────────────

    AdminFaq:
      type: object
      required: [id, question, answer, sort_order, is_published, created_at]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: ["string", "null"] }
        sort_order: { type: integer }
        is_published: { type: boolean }
        created_at: { type: string }

    AdminFaqInput:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
        category: { type: string }
        sort_order: { type: integer }
        is_published: { type: boolean }

    AdminFaqUpdate:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        sort_order: { type: integer }
        is_published: { type: boolean }

    # ── Admin Team Schemas ────────────────────────────────────────────────────

    AdminTeamMember:
      type: object
      required: [id, name, role_title, sort_order, is_active, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        role_title: { type: string }
        bio: { type: ["string", "null"] }
        photo_url: { type: ["string", "null"] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string }

    AdminTeamMemberInput:
      type: object
      required: [name, role_title]
      properties:
        name: { type: string, minLength: 1 }
        role_title: { type: string, minLength: 1 }
        bio: { type: string }
        photo_url: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }

    AdminTeamMemberUpdate:
      type: object
      properties:
        name: { type: string }
        role_title: { type: string }
        bio: { type: string }
        photo_url: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }

    # ── Admin Settings Schemas ────────────────────────────────────────────────

    AdminSetting:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }

    AdminSettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/AdminSetting"

    # ── Admin User Schemas ────────────────────────────────────────────────────

    AdminUserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        password: { type: string, minLength: 8 }
        role: { type: string }

    AdminUserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string }
        is_active: { type: boolean }
